name: Set up FFmpeg
description: Restore a checksum-verified static FFmpeg for Linux x64 audio tests.
runs:
  using: composite
  steps:
    - name: Check platform
      shell: bash
      run: |
        if [ "$RUNNER_OS" != Linux ] || [ "$RUNNER_ARCH" != X64 ]; then
          echo "::error::The pinned FFmpeg binary requires Linux X64."
          exit 1
        fi
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      id: cache
      with:
        path: ${{ runner.tool_cache }}/sodalis-ffmpeg
        key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/actions/setup-ffmpeg/action.yml') }}
    - name: Download pinned FFmpeg
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p "$RUNNER_TOOL_CACHE/sodalis-ffmpeg"
        cd "$RUNNER_TOOL_CACHE/sodalis-ffmpeg"
        curl --fail --location --silent --show-error \
          --connect-timeout 10 --max-time 60 --retry 2 --retry-max-time 90 \
          --output ffmpeg.gz \
          https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-linux-x64.gz
        echo 'bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa  ffmpeg.gz' | sha256sum --check --strict
        gzip --decompress --force ffmpeg.gz
    - name: Verify FFmpeg and add to PATH
      shell: bash
      run: |
        cd "$RUNNER_TOOL_CACHE/sodalis-ffmpeg"
        echo 'e7e7fb30477f717e6f55f9180a70386c62677ef8a4d4d1a5d948f4098aa3eb99  ffmpeg' | sha256sum --check --strict
        chmod +x ffmpeg
        ./ffmpeg -version
        echo "$PWD" >> "$GITHUB_PATH"
